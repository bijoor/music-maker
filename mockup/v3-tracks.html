<title>Strudel Music Maker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one fixed screen (iPad landscape first). Top bar · track lanes · instrument panel. Code slides over from the right. Nothing scrolls at page level. */
:root {
  --bg: #e9ebe8; --panel: #f7f8f6; --panel-2: #eef0ec; --line: #d3d7d1; --fg: #1b1f1c; --muted: #5d655f;
  --accent: #2f5bea; --accent-ink: #ffffff; --rec: #d6336c;
  --key-w: #ffffff; --key-w-ink: #3a3f3b; --key-b: #222622; --key-off: #d9dcd7; --shade: rgba(20, 24, 21, .35);
  --code-bg: #f1f3ef; --c-com: #7a837c; --c-fn: #2f5bea; --c-str: #2b8a3e; --c-num: #c2410c; --c-kw: #ae3ec9;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px; --head-w: 170px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121513; --panel: #1a1e1b; --panel-2: #20251f; --line: #2f3530; --fg: #e8ece7; --muted: #9aa49c;
  --accent: #7d97ff; --accent-ink: #0d1020; --rec: #f06595;
  --key-w: #e4e8e3; --key-w-ink: #2a2e2b; --key-b: #0b0d0b; --key-off: #343a35; --shade: rgba(0, 0, 0, .55);
  --code-bg: #151916; --c-com: #6f7a72; --c-fn: #8ea6ff; --c-str: #69db7c; --c-num: #ffa94d; --c-kw: #e599f7;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121513; --panel: #1a1e1b; --panel-2: #20251f; --line: #2f3530; --fg: #e8ece7; --muted: #9aa49c;
  --accent: #7d97ff; --accent-ink: #0d1020; --rec: #f06595;
  --key-w: #e4e8e3; --key-w-ink: #2a2e2b; --key-b: #0b0d0b; --key-off: #343a35; --shade: rgba(0, 0, 0, .55);
  --code-bg: #151916; --c-com: #6f7a72; --c-fn: #8ea6ff; --c-str: #69db7c; --c-num: #ffa94d; --c-kw: #e599f7;
  color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { box-sizing: border-box; height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding-inline: 12px; padding-block: 8px; position: relative; user-select: none; -webkit-user-select: none; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-family: var(--body); font-weight: 500; font-size: 10px; color: var(--muted); margin-left: 6px; letter-spacing: .06em; text-transform: uppercase; }
.group { display: flex; align-items: center; gap: 6px; }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.btn { white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; line-height: 1.2; min-height: 36px; }
.btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.sm { min-height: 30px; padding: 4px 9px; font-size: 13px; }
.play { width: 52px; min-height: 40px; display: grid; place-items: center; font-size: 16px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.play.stop { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bpm { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.bpm button { border: 0; background: none; width: 32px; min-height: 36px; font-size: 16px; }
.bpm output { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.bpm output small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 3px; }
select { padding: 7px 8px; min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 7px 14px; min-height: 36px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.seg button.rec[aria-pressed="true"] { background: var(--rec); color: #fff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 6px; vertical-align: 1px; }
.seg button.rec[aria-pressed="true"] .dot { background: #fff; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; min-height: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.live { border-color: var(--rec); color: var(--rec); }

/* Track lanes */
.tracks { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: 26vh; overflow: hidden; position: relative; }
.thead-row, .trow { display: grid; grid-template-columns: var(--head-w) minmax(0, 1fr); gap: 12px; padding-right: 12px; }
.thead-row { align-items: center; padding-block: 5px 3px; border-bottom: 1px solid var(--line); }
.thead-row .title { display: flex; align-items: center; gap: 8px; padding-left: 12px; }
.thead-row h2 { font-family: var(--display); font-size: 14px; font-weight: 600; margin: 0; }
.beats { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.beats span { text-align: left; padding-left: 3px; }
.beats span.b { color: var(--fg); font-weight: 600; }
.tlist { overflow-y: auto; min-height: 0; }
.trow { align-items: center; min-height: 34px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:last-child { border-bottom: 0; }
.trow.sel { background: var(--panel-2); }
.th { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 100%; }
.th .c { align-self: stretch; border-radius: 0 3px 3px 0; }
.th .n { display: grid; min-width: 0; }
.th strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th .n > span { display: none; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms { display: flex; gap: 4px; }
.ms button { width: 28px; height: 24px; padding: 0; font-size: 11px; font-weight: 600; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
.ms button.m[aria-pressed="true"] { background: #f59f00; color: #1b1f1c; border-color: #f59f00; }
.ms button.s[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lane { position: relative; height: 28px; }
.lane .bg, .lane .fg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); }
.lane .bg i { border-left: 1px solid var(--line); }
.lane .bg i.b { border-left: 1px solid var(--muted); }
.lane .bg i:last-child { border-right: 1px solid var(--line); }
.lane .bg i.sel { background: color-mix(in srgb, var(--fg) 12%, transparent); }
.lane .fg { padding-block: 3px; gap: 0 2px; pointer-events: none; }
.ln { background: var(--tc); color: #fff; border-radius: 4px; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; padding-inline: 5px; overflow: hidden; white-space: nowrap; margin-inline: 1px; min-width: 0; }
.ln.hit { filter: brightness(1.3); box-shadow: 0 0 0 2px var(--accent); }
.lane.drum .fg { grid-template-rows: repeat(3, 1fr); padding-block: 2px; gap: 1px; }
.dh { justify-self: center; align-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.dh.s { border-radius: 2px; }
.dh.h { width: 5px; height: 5px; opacity: .8; }
.dh.hit { box-shadow: 0 0 0 3px var(--accent); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); left: calc(var(--ph, 0) * 100%); pointer-events: none; }
.trow.muted .lane, .trow.muted .n { opacity: .4; }
.addmenu { position: absolute; left: 12px; top: 40px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px var(--shade); padding: 6px; display: grid; min-width: 220px; }
.addmenu button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
.addmenu button:hover { background: var(--panel-2); }
.addmenu i { width: 10px; height: 10px; border-radius: 3px; }

/* Instrument panel */
.panel { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); overflow: hidden; position: relative; }
.ph-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 10px; border-bottom: 1px solid var(--line); }
.ph-head h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0; }
.ph-head .sw { width: 10px; height: 22px; border-radius: 3px; }
.stage { min-height: 0; min-width: 0; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.fx { position: absolute; right: 10px; top: 46px; z-index: 25; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px var(--shade); padding: 12px; display: grid; align-content: start; gap: 12px; }
.knobs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 4px; }
.knob { display: grid; justify-items: center; gap: 3px; }
.knob .dial { width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(from 225deg, var(--tc) 0 calc(var(--v) * 270deg), var(--line) 0 270deg, transparent 0); display: grid; place-items: center; cursor: ns-resize; touch-action: none; }
.knob .dial::after { content: ""; width: 32px; height: 32px; border-radius: 50%; background: var(--panel); }
.knob .kl { font-size: 11px; color: var(--muted); }
.knob .kv { font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.vars .btn { font-family: var(--mono); font-size: 12px; min-height: 34px; padding: 4px; }
.vars .btn[aria-pressed="true"] { background: var(--tc); border-color: var(--tc); color: #fff; }

/* Drums */
.drums { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 36%); gap: 14px; min-height: 0; flex: 1; }
.dgrid-wrap { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; overflow-y: auto; }
.drums .cell { min-height: 18px; }
.drums .pad strong { font-size: 13px; } .drums .pad code { font-size: 11px; } .drums .pad { min-height: 0; }
.grid { display: grid; grid-template-columns: 76px repeat(16, minmax(0, 1fr)); gap: 3px; }
.grid .rh { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.grid .rh.out { color: var(--muted); font-style: italic; }
.colhead { border: 0; background: none; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; border-radius: 3px; padding-block: 1px; }
.colhead.b { color: var(--fg); font-weight: 600; }
.colhead.sel { background: var(--fg); color: var(--bg); }
.cell { min-height: 22px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); padding: 0; }
.cell.beat { border-left: 2px solid var(--muted); }
.cell.on { background: var(--tc); border-color: var(--tc); }
.cell.cont { background: color-mix(in srgb, var(--tc) 45%, transparent); border-color: transparent; }
.cell.phc { box-shadow: inset 0 0 0 2px var(--accent); }
.cell.selcol { outline: 2px dashed var(--fg); outline-offset: -2px; }
.cell.hit { filter: brightness(1.35); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .btn.queued { border-color: var(--accent); color: var(--accent); }
.pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px; min-height: 0; flex: 1; }
.kit { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 12px; }
.kit-main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr 1fr 1.3fr; gap: 10px; min-height: 0; }
.kit-aux { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0; padding: 8px; border-radius: 14px; background: var(--panel-2); }
.pad.wide { grid-column: span 2; }
.pad.wide strong { font-size: 20px; }
.pad.aux { border-radius: 12px; background: var(--panel); }
.pad.aux strong { font-size: 13px; }
.pad.aux code { font-size: 11px; }
.drums .kit { grid-template-columns: minmax(0, 1fr); grid-template-rows: 3fr 2fr; gap: 8px; }
.drums .kit-aux { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, 1fr); padding: 6px; }
.pad { border-radius: 16px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: center; justify-items: center; gap: 2px; touch-action: none; min-height: 56px; }
.pad strong { font-size: 17px; font-weight: 600; }
.pad code { font-size: 13px; }
.pad code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pad.down { background: var(--tc); color: #fff; border-color: var(--tc); }
.pad.down code { color: #fff; }

/* Melodic */
.chords { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.chord { min-height: 58px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: center; gap: 0; text-align: center; touch-action: none; }
.chord strong { font-size: 16px; }
.chord span { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.chord.down { background: var(--tc); color: #fff; border-color: var(--tc); }
.chord.down span { color: #fff; }
.kbwrap { flex: 1; min-height: 96px; display: flex; gap: 8px; }
.drum-play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 6px; }
.chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 12px 5px 8px; white-space: nowrap; min-height: 34px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; }
.chip.sel { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.muted { opacity: .45; }
.octbtn { width: 48px; display: grid; gap: 6px; align-content: center; }
.octbtn button { min-height: 44px; padding: 0; }
.octbtn span { text-align: center; font-size: 11px; color: var(--muted); }
.kb { position: relative; flex: 1; touch-action: none; }
.wk, .bk { position: absolute; top: 0; border: 1px solid var(--line); border-radius: 0 0 10px 10px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 10px; font-size: 13px; }
.wk { background: var(--key-w); color: var(--key-w-ink); height: 100%; z-index: 1; }
.bk { background: var(--key-b); color: #ddd; height: 60%; z-index: 2; border-color: var(--key-b); }
.wk.off { background: var(--key-off); color: var(--muted); }
.bk.off { background: var(--key-off); border-color: var(--line); color: var(--muted); }
.wk.inscale::after, .bk.inscale::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 3px; height: 3px; border-radius: 2px; background: var(--tc); }
.wk.down, .bk.down { background: var(--tc); color: #fff; }
.wk .nl, .bk .nl { font-weight: 600; }
.strips { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; touch-action: none; }
.strip-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.stp { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: end; justify-items: center; padding-bottom: 8px; gap: 1px; }
.stp strong { font-size: 18px; }
.stp span { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.stp.sa { border-color: var(--tc); box-shadow: inset 0 -4px 0 var(--tc); }
.stp.down { background: var(--tc); color: #fff; }
.stp.down span { color: #fff; }
.roll { flex: 1; min-height: 80px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.roll .grid { grid-template-columns: 70px repeat(16, minmax(0, 1fr)); gap: 2px; }
.roll .rh code { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.roll .cell { min-height: 20px; }
.mel-edit .kbwrap { flex: 0 0 130px; min-height: 0; }
.mel-edit .chord { min-height: 40px; }

/* Code drawer (overlay) */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 46%); z-index: 30; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px var(--shade); }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0; }
.drawer pre { margin: 0; padding: 12px 14px; overflow: auto; background: var(--code-bg); font-family: var(--mono); font-size: 12.5px; line-height: 1.65; white-space: pre; user-select: text; -webkit-user-select: text; }
.drawer .com, .drawer .fence { color: var(--c-com); }
.drawer .fn { color: var(--c-fn); }
.drawer .str { color: var(--c-str); }
.drawer .num { color: var(--c-num); }
.drawer .kw { color: var(--c-kw); font-weight: 500; }
.drawer .tok { color: var(--fg); border-radius: 3px; cursor: pointer; padding: 0 1px; }
.drawer .tok.hover { outline: 1px solid var(--accent); }
.drawer .tok.hit { background: var(--accent); color: var(--accent-ink); }
.drawer .line.selt { background: color-mix(in srgb, var(--accent) 12%, transparent); display: inline-block; min-width: 100%; }
.drawer-f { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.45; }

/* Overlays */
.overlay { position: absolute; inset: 0; background: var(--shade); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(640px, 100%); max-height: 100%; overflow: auto; }
.dialog-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dialog-h h2 { font-family: var(--display); font-size: 16px; margin: 0; }
.dialog-b { padding: 14px 16px; display: grid; gap: 12px; }
.dialog-b dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
.dialog-b dt { font-weight: 600; }
.dialog-b dd { margin: 0; color: var(--muted); }
.swaras { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.swc { display: grid; gap: 4px; }
.swc button { padding: 8px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); display: grid; gap: 1px; font-size: 12px; }
.swc button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swc button small { font-size: 10px; opacity: .75; }
.swc input { width: 100%; padding: 3px 2px; font-size: 11px; text-align: center; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 4px; }
.field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); user-select: text; -webkit-user-select: text; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 1100px) { :root { --head-w: 160px; } .brand { display: none; } .ph-head .note { display: none; } .bar { gap: 8px 10px; } }

  { label: 'Piano', kind: 'melodic', sound: 'piano', name: 'Piano', color: '#1c7ed6', octave: 3, poly: true },
  { label: 'Saw lead', kind: 'melodic', sound: 'sawtooth', name: 'Lead', color: '#ae3ec9', octave: 4, poly: false },

    { id: 't3', name: 'Keys', color: '#1c7ed6', kind: 'melodic', sound: 'piano', octave: 3, poly: true, steps: stepsFrom([[0,['c3','eb3','g3'],8],[8,['ab2','c3','eb3'],8]]), fx: { ...fxDefault(), room: .4, gain: .7 }, vars: {}, mute: false, solo: false },

  ],

const track = id => S.tracks.find(t => t.id === id);
const selTrack = () => track(S.sel) || S.tracks[0];
const scale = () => SCALES[S.scaleId] || S.custom[S.scaleId];
const tonicPc = () => TONICS.indexOf(S.tonic);
const near = (a, b) => Math.abs(a - b) < .001;
function inScale(midi) { const pc = ((Math.round(midi) - tonicPc()) % 12 + 12) % 12; return scale().deg.includes(pc); }

const fmt = n => String(Math.round(n * 100) / 100).replace(/^0\./, '.');

function coveredBy(t, s) { for (let j = s; j >= 0; j--) { const st = t.steps[j]; if (st && st.p.length) return j + (st.len || 1) > s ? { j, st } : null; } return null; }

  const cov = coveredBy(t, s); if (cov && cov.j < s) cov.st.len = s - cov.j;

  if (add && cur && t.poly) { pitches.forEach(p => { if (!cur.p.some(x => near(x, p))) cur.p.push(p); }); cur.len = Math.max(cur.len, len); }
  else t.steps[s] = { p: [...pitches], len };
  for (let i = s + 1; i < Math.min(16, s + len); i++) t.steps[i] = null;
}
function togglePitch(t, s, pitch) {
  const cur = t.steps[s];
  if (cur && cur.p.some(x => near(x, pitch))) { cur.p = cur.p.filter(x => !near(x, pitch)); if (!cur.p.length) t.steps[s] = null; }
  else writeNote(t, s, [pitch], 1, t.poly);
}
function changed() { renderTracks(); renderPanel(); renderCode(); }
function input(kind, value) {
  const t = kind === 'pad' ? (selTrack().kind === 'drums' ? selTrack() : S.tracks.find(x => x.kind === 'drums')) : selTrack();
  if (!t) return;
  if (kind !== 'pad' && t.kind === 'drums') return;
  const pitches = kind === 'chord' ? chordSet()[value].notes : value;
  preview(t, pitches);
  if (S.mode === 'perform') return;
  if (S.mode === 'record') {
    if (!S.playing) { start(); return; }
    const s = currentStep(); if (s === null) return;
    if (kind === 'pad') t.rows[value][s] = 1; else writeNote(t, s, [].concat(pitches), kind === 'chord' ? 4 : 1, true);
    renderTracks(); renderCode(); if (S.mode === 'record' && t.kind === 'drums' && t.id === S.sel) renderPanel();
    return;
  }
  const s = S.selStep;
  if (kind === 'pad') { t.rows[value][s] = t.rows[value][s] ? 0 : 1; S.selStep = (s + 1) % 16; }
  else if (kind === 'chord') { writeNote(t, s, pitches, S.chordLen); S.selStep = (s + S.chordLen) % 16; }
  else { writeNote(t, s, [pitches], 1, false); S.selStep = (s + 1) % 16; }
  changed();
}
function addTrack(i) {
  const x = INSTRUMENTS[i], id = 't' + (uid++);
  const t = { id, name: x.name, color: x.color, kind: x.kind, fx: fxDefault(), vars: {}, mute: false, solo: false };
  if (x.kind === 'drums') { t.bank = x.bank; t.rows = emptyRows(); }
  else { t.sound = x.sound; t.octave = x.octave; t.poly = x.poly; t.steps = Array(16).fill(null); if (x.drone) { t.steps[0] = { p: (scale().drone || [0, 7]).map(g => scalePitch(g, x.octave)), len: 16 }; t.fx.lpf = 1200; t.fx.gain = .6; } }
  S.tracks.push(t); S.sel = id; S.adding = false; changed();
  const list = document.querySelector('.tlist'); if (list) list.scrollTop = list.scrollHeight;
}

// ---------- Overlays: help and scale editor ----------
let draft = null;
function showHelp() {
  $('overlay').innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="hh"><div class="dialog-h"><h2 id="hh">How it works</h2><button class="btn sm" data-close>Close</button></div>
    <div class="dialog-b"><dl>
      <dt>Track lanes</dt><dd>Each lane is one bar that loops. It is split into 16 steps (16th notes); every 4 steps is a beat, numbered 1 to 4. A coloured bar is a note: its label is the note or chord, and its length is how long it is held. Drum lanes show cymbals and hats on top, snares and hand percussion in the middle, kicks and toms at the bottom.</dd>
      <dt>Select a track</dt><dd>Tap a lane. The panel below switches to that track's instrument: pads for drums, a keyboard and chord pads for everything else.</dd>
      <dt>Perform</dt><dd>Play freely over the loop. Nothing is written.</dd>
      <dt>Record</dt><dd>Your notes snap to the nearest step and are added to the selected track as it loops.</dd>
      <dt>Edit</dt><dd>Tap a step in a lane or the step numbers, then tap a key, chord or pad to place it. Melodic tracks also show a note grid.</dd>
      <dt>Scale pads</dt><dd>Shows only the notes of the scale or raga as large pads, so every note fits.</dd>
      <dt>Keyboard</dt><dd>With a hardware keyboard: <span class="kbd">A</span>–<span class="kbd">;</span> notes, <span class="kbd">1</span>–<span class="kbd">4</span>, <span class="kbd">Q</span>–<span class="kbd">R</span>, <span class="kbd">A</span>–<span class="kbd">F</span>, <span class="kbd">Z</span>–<span class="kbd">V</span> drum pads (when a drum track is selected), <span class="kbd">1</span>–<span class="kbd">8</span> chords, <span class="kbd">Space</span> play or stop.</dd>
    </dl></div></div>`;
  $('overlay').hidden = false;
}
function openScaleEditor() { const sc = scale(); draft = { name: sc.custom ? sc.name : 'My ' + sc.name, deg: [...sc.deg], cents: { ...(sc.cents || {}) } }; renderScaleEditor(); $('overlay').hidden = false; }
function renderScaleEditor() {
  $('overlay').innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="se-h"><div class="dialog-h"><h2 id="se-h">Custom scale</h2><button class="btn sm" data-close>Close</button></div>
    <div class="dialog-b">
      <p class="note">Tap the notes of one octave, with Sa on ${S.tonic}. Nudge any note in cents for shrutis; those notes are written as decimal MIDI numbers, for example <code>note("62.88")</code>.</p>
      <div class="field"><label class="lbl" for="se-name">Name</label><input id="se-name" value="${esc(draft.name)}"></div>
      <div class="swaras">${Array.from({ length: 12 }, (_, d) => `<div class="swc"><button data-swara="${d}" aria-pressed="${draft.deg.includes(d)}"${d === 0 ? ' disabled' : ''}>${SARGAM[d]}<small>${TONICS[(tonicPc() + d) % 12]}</small></button><input type="number" min="-50" max="50" step="1" value="${draft.cents[d] || 0}" aria-label="${SARGAM[d]} cents" data-cents="${d}"></div>`).join('')}</div>
      <div class="row"><button class="btn on" id="se-save">Save and use</button><button class="btn" id="se-play">Play scale</button><span class="note">${draft.deg.length} notes · aroha / avaroha guidance planned</span></div>
    </div></div>`;
}

// ---------- Events ----------
let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }
function flash(el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 150); }
document.addEventListener('pointerdown', e => {
  const pad = e.target.closest('[data-pad]'); if (pad) { input('pad', pad.dataset.pad); flash(pad); return; }
  const key = e.target.closest('[data-key]'); if (key) { if (key.getAttribute('aria-disabled') !== 'true') { input('key', +key.dataset.key); flash(key); } return; }
  const ch = e.target.closest('[data-chord]'); if (ch) { input('chord', +ch.dataset.chord); flash(ch); return; }
  const d = e.target.closest('[data-knob]'); if (d) { drag = { key: d.dataset.knob, y: e.clientY, v: knobVal(d.dataset.knob) }; d.setPointerCapture(e.pointerId); e.preventDefault(); }
});
document.addEventListener('click', e => {
  if (S.fxOpen && !e.target.closest('.fx, #fxbtn')) { S.fxOpen = false; renderPanel(); }
  const el = e.target.closest('button, [data-sel], .tok'); if (!el) { if (S.adding && !e.target.closest('.addmenu')) { S.adding = false; renderTracks(); } return; }
  const d = el.dataset, t = selTrack();
  if (el.id === 'play') return S.playing ? stop() : start();
  if (el.id === 'bpm-' || el.id === 'bpm+') { S.bpm = Math.min(200, Math.max(60, S.bpm + (el.id === 'bpm+' ? 2 : -2))); renderBar(); renderCode(); return; }
  if (d.mode) { S.mode = d.mode; renderBar(); renderTracks(); renderPanel(); return; }
  if (el.id === 'codebtn' || el.id === 'closecode') { S.codeOpen = !S.codeOpen; renderBar(); $('drawer').hidden = !S.codeOpen; return; }
  if (el.id === 'sargam') { S.sargam = !S.sargam; renderBar(); renderTracks(); renderPanel(); return; }
  if (el.id === 'help') return showHelp();
  if (d.close !== undefined) { $('overlay').hidden = true; return; }
  if (el.id === 'copy') { navigator.clipboard.writeText(codeText).then(() => toast('Code copied'), () => { const r = document.createRange(); r.selectNodeContents($('codepre')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Code selected; copy it from the menu'); }); return; }
  if (el.id === 'addtrack') { S.adding = !S.adding; renderTracks(); return; }
  if (d.add) return addTrack(+d.add);
  if (d.mute) { const x = track(d.mute); x.mute = !x.mute; renderTracks(); renderCode(); return; }
  if (d.solo) { const x = track(d.solo); x.solo = !x.solo; renderTracks(); renderCode(); return; }
  if (el.classList.contains('tok')) { S.sel = d.t; S.selStep = +d.s.split(',')[0]; S.mode = 'edit'; renderAll(); return; }
  if (d.sel) {
    const ls = e.target.closest('[data-lstep]'); const changedSel = S.sel !== d.sel; S.sel = d.sel;
    if (S.mode === 'edit' && ls) S.selStep = +ls.dataset.lstep; else if (changedSel) S.selStep = 0;
    if (S.adding) S.adding = false;
    renderTracks(); renderPanel(); renderCode(); return;
  }
  if (el.classList.contains('colhead')) { S.selStep = +d.step; S.mode = 'edit'; renderBar(); renderTracks(); renderPanel(); return; }
  if (d.layout) { S.layout = d.layout; renderPanel(); return; }
  if (d.kboct) { S.kbOct = +d.kboct; renderPanel(); return; }
  if (el.id === 'fxbtn') { S.fxOpen = !S.fxOpen; renderPanel(); return; }
  if (el.id === 'collapse') { S.collapsed = !S.collapsed; renderTracks(); return; }
  if (el.id === 'lock') { S.scaleLock = !S.scaleLock; renderPanel(); return; }
  if (el.id === 'octup' || el.id === 'octdn') { t.octave = Math.min(6, Math.max(1, t.octave + (el.id === 'octup' ? 1 : -1))); renderPanel(); return; }
  if (d.clen) { S.chordLen = +d.clen; renderPanel(); return; }
  if (el.classList.contains('cell')) {
    const s = +d.col;
    if (d.v) { t.rows[d.v][s] = t.rows[d.v][s] ? 0 : 1; if (t.rows[d.v][s]) preview(t, d.v); }
    else { const p = +d.p, cov = coveredBy(t, s); if (el.classList.contains('cont') && cov) togglePitch(t, cov.j, p); else { togglePitch(t, s, p); if (t.steps[s] && t.steps[s].p.some(x => near(x, p))) preview(t, p); } }
    if (S.mode === 'edit') S.selStep = s;
    changed(); return;
  }
  if (d.preset) { if (S.playing) { S.queued = d.preset; renderPanel(); } else { applyPreset(d.preset); changed(); } return; }
  if (d.var) { t.vars[d.var] = !t.vars[d.var]; renderPanel(); renderCode(); return; }
  if (el.id === 'clear') { if (t.kind === 'drums') t.rows = emptyRows(); else t.steps = Array(16).fill(null); changed(); return; }
  if (el.id === 'deltrack') { if (S.tracks.length <= 1) return; S.tracks = S.tracks.filter(x => x.id !== t.id); S.sel = S.tracks[0].id; changed(); toast(`Removed ${t.name}`); return; }
  if (d.swara) { const n = +d.swara; draft.deg = draft.deg.includes(n) ? draft.deg.filter(x => x !== n) : [...draft.deg, n].sort((a, b) => a - b); renderScaleEditor(); return; }
  if (el.id === 'se-play') { initAudio(); const t2 = { sound: 'piano', fx: fxDefault() }; [...draft.deg, 12].forEach((g, i) => playNote(t2, 60 + tonicPc() + g + (draft.cents[g % 12] || 0) / 100, ac.currentTime + .05 + i * .28, .26)); return; }
  if (el.id === 'se-save') { const id = 'c' + Date.now(); S.custom[id] = { name: draft.name || 'My scale', group: 'Custom', custom: true, deg: draft.deg, cents: Object.fromEntries(Object.entries(draft.cents).filter(([, v]) => v)) }; S.scaleId = id; $('overlay').hidden = true; renderAll(); toast(`Using ${S.custom[id].name}`); return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.cents !== undefined) draft.cents[+el.dataset.cents] = +el.value;
  if (el.id === 'se-name') draft.name = el.value;
});
document.addEventListener('change', e => {
  const el = e.target, t = selTrack();
  if (el.id === 'tonic') { S.tonic = el.value; renderTracks(); renderPanel(); renderCode(); }
  if (el.id === 'scale') { if (el.value === '__new') { el.value = S.scaleId; openScaleEditor(); } else { S.scaleId = el.value; renderTracks(); renderPanel(); renderCode(); } }
  if (el.id === 'bank') { t.bank = el.value; renderTracks(); renderCode(); }
  if (el.id === 'sound') { t.sound = el.value; renderTracks(); renderCode(); }
  if (el.id === 'clen') S.chordLen = +el.value;
});
let drag = null;
function setKnob(key, v01) {
  const t = selTrack(); v01 = Math.min(1, Math.max(0, v01));
  if (key === 'lpf') t.fx.lpf = v01 >= .995 ? 20000 : Math.round(LPF.from01(v01));
  else if (key === 'pan') t.fx.pan = Math.abs(v01 - .5) < .03 ? .5 : Math.round(v01 * 100) / 100;
  else if (key === 'gain') t.fx.gain = Math.round(v01 * 150) / 100;
  else t.fx[key] = Math.round(v01 * 100) / 100;
  const dial = document.querySelector(`[data-knob="${key}"]`); if (!dial) return;
  const disp = knobDisp(key, t.fx); dial.style.setProperty('--v', knobVal(key)); dial.setAttribute('aria-valuetext', disp); dial.nextElementSibling.textContent = disp;
  renderCode();
}
document.addEventListener('pointermove', e => { if (drag) setKnob(drag.key, drag.v + (drag.y - e.clientY) / 160); });
document.addEventListener('pointerup', () => drag = null);
document.addEventListener('pointercancel', () => drag = null);
document.addEventListener('keydown', e => {
  const d = e.target.closest && e.target.closest('[data-knob]');
  if (d && ['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); setKnob(d.dataset.knob, knobVal(d.dataset.knob) + (e.key === 'ArrowUp' || e.key === 'ArrowRight' ? .05 : -.05)); return; }
  if (!$('overlay').hidden) { if (e.key === 'Escape') $('overlay').hidden = true; return; }
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.key === ' ') { e.preventDefault(); return S.playing ? stop() : start(); }
  const k = e.key.toLowerCase();
  if (selTrack().kind === 'drums') { const pad = KIT.find(x => x.key === k); if (pad) { input('pad', pad.v); const el = document.querySelector(`[data-pad="${pad.v}"]`); if (el) flash(el); } return; }
  if (/^[1-8]$/.test(k)) { const i = +k - 1; if (i < chordSet().length) { input('chord', i); const el = document.querySelector(`[data-chord="${i}"]`); if (el) flash(el); } return; }
  const ki = KEYMAP.indexOf(k); if (ki < 0) return;
  const keys = [...document.querySelectorAll('[data-key]')].filter(x => x.getAttribute('aria-disabled') !== 'true').sort((a, b) => +a.dataset.key - +b.dataset.key);
  const target = S.layout === 'strips' || S.scaleLock ? keys[ki] : [...document.querySelectorAll('[data-key]')].sort((a, b) => +a.dataset.key - +b.dataset.key)[ki];
  if (target) { input('key', +target.dataset.key); flash(target); }
});
document.addEventListener('mouseover', e => {
  document.querySelectorAll('.tok.hover').forEach(x => x.classList.remove('hover'));
  const c = e.target.closest('.cell.on, .cell.cont'); if (c) (spanIndex.get(c.dataset.t + ':' + c.dataset.s) || []).forEach(x => x.classList.add('hover'));
});
renderAll();
</script>
