<title>Strudel Music Maker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one fixed iPad screen. Top bar · clip launcher (tracks × 4 clip slots, scenes on top) · clip editor with the playable instrument. Code slides over from the right. */
:root {
  --bg: #e9ebe8; --panel: #f7f8f6; --panel-2: #eef0ec; --line: #d3d7d1; --fg: #1b1f1c; --muted: #5d655f;
  --accent: #2f5bea; --accent-ink: #ffffff; --rec: #d6336c;
  --key-w: #ffffff; --key-w-ink: #3a3f3b; --key-b: #222622; --key-off: #d9dcd7; --shade: rgba(20, 24, 21, .35);
  --code-bg: #f1f3ef; --c-com: #7a837c; --c-fn: #2f5bea; --c-str: #2b8a3e; --c-num: #c2410c; --c-kw: #ae3ec9;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px; --head-w: 210px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121513; --panel: #1a1e1b; --panel-2: #20251f; --line: #2f3530; --fg: #e8ece7; --muted: #9aa49c;
  --accent: #7d97ff; --accent-ink: #0d1020; --rec: #f06595;
  --key-w: #e4e8e3; --key-w-ink: #2a2e2b; --key-b: #0b0d0b; --key-off: #343a35; --shade: rgba(0, 0, 0, .55);
  --code-bg: #151916; --c-com: #6f7a72; --c-fn: #8ea6ff; --c-str: #69db7c; --c-num: #ffa94d; --c-kw: #e599f7;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121513; --panel: #1a1e1b; --panel-2: #20251f; --line: #2f3530; --fg: #e8ece7; --muted: #9aa49c;
  --accent: #7d97ff; --accent-ink: #0d1020; --rec: #f06595;
  --key-w: #e4e8e3; --key-w-ink: #2a2e2b; --key-b: #0b0d0b; --key-off: #343a35; --shade: rgba(0, 0, 0, .55);
  --code-bg: #151916; --c-com: #6f7a72; --c-fn: #8ea6ff; --c-str: #69db7c; --c-num: #ffa94d; --c-kw: #e599f7;
  color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { box-sizing: border-box; height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding-inline: 12px; padding-block: 8px; position: relative; user-select: none; -webkit-user-select: none; }
.btn { white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; line-height: 1.2; min-height: 36px; }
.btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.sm { min-height: 30px; padding: 4px 9px; font-size: 13px; }
select { padding: 6px 8px; min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; min-height: 34px; border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.seg button.rec[aria-pressed="true"] { background: var(--rec); color: #fff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 6px; vertical-align: 1px; }
.seg button.rec[aria-pressed="true"] .dot { background: #fff; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; min-height: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.play { width: 52px; min-height: 40px; display: grid; place-items: center; font-size: 16px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.play.stop { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bpm { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.bpm button { border: 0; background: none; width: 30px; min-height: 34px; font-size: 16px; }
.bpm output { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.bpm output small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 3px; }
.counter { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; }
.counter b { font-weight: 600; min-width: 46px; }
.beatdots { display: flex; gap: 4px; }
.beatdots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.beatdots i.on { background: var(--accent); }
.beatdots i.on:first-child { background: var(--rec); }

/* Clip launcher */
.launcher { overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: 36vh; position: relative; }
.ltitle { display: flex; align-items: center; gap: 6px; }
.ltitle select { min-height: 30px; padding: 3px 6px; font-size: 12px; }
.lrow { display: grid; grid-template-columns: var(--head-w) repeat(4, minmax(0, 1fr)) 40px; gap: 6px; padding: 4px 8px; align-items: stretch; }
.lhead { border-bottom: 1px solid var(--line); padding-block: 6px; align-items: center; }
.lhead h2 { font-family: var(--display); font-size: 14px; font-weight: 600; margin: 0; }
.scene { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; min-height: 30px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.scene span { color: var(--muted); font-weight: 400; }
.lbody { overflow-y: auto; min-height: 0; }
.trow { min-height: 46px; }
.trow.sel .thd { background: var(--panel-2); }
.thd { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 8px; align-items: center; border-radius: 8px; padding-right: 6px; cursor: pointer; }
.thd .c { align-self: stretch; border-radius: 3px; }
.thd .n { display: grid; gap: 3px; min-width: 0; }
.thd strong { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vol { width: 100%; height: 18px; accent-color: var(--tc); margin: 0; }
.ms { display: flex; gap: 4px; }
.ms button { width: 28px; height: 26px; padding: 0; font-size: 11px; font-weight: 600; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
.ms button.m[aria-pressed="true"] { background: #f59f00; color: #1b1f1c; border-color: #f59f00; }
.ms button.s[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.trow.muted .clip, .trow.muted .n { opacity: .45; }
.clip { position: relative; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; padding: 5px 8px 6px 12px; display: grid; gap: 3px; overflow: hidden; min-height: 42px; touch-action: manipulation; }
.clip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tc); }
.clip .cn { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.clip .cn span { font-weight: 400; color: var(--muted); }
.thumb { position: relative; height: 12px; display: grid; }
.thumb i { background: var(--tc); border-radius: 2px; }
.thumb.drum { grid-template-rows: repeat(3, 1fr); gap: 1px; }
.thumb.drum i { width: 3px; justify-self: center; border-radius: 1px; }
.clip.playing { background: var(--tc); border-color: var(--tc); color: #fff; }
.clip.playing .cn span { color: rgba(255,255,255,.8); }
.clip.playing .thumb i { background: #fff; }
.clip .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--pos, 0) * 100%); background: rgba(255,255,255,.85); }
.clip.queued { border: 2px dashed var(--tc); animation: blink .5s steps(2) infinite; }
.clip.stopping { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.clip.empty { border-style: dashed; background: none; color: var(--muted); justify-items: center; align-content: center; font-size: 18px; }
.clip.empty::before { display: none; }
.clip.empty.recarm { color: var(--rec); font-size: 12px; font-weight: 600; }
.clip.selected { outline: 3px solid var(--fg); outline-offset: 1px; }
.tstop { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; font-size: 12px; }
.lfoot { border-top: 1px solid var(--line); padding: 5px 8px; display: flex; gap: 8px; align-items: center; }
.addmenu { position: absolute; left: 12px; top: 44px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px var(--shade); padding: 6px; display: grid; min-width: 220px; }
.addmenu button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
.addmenu button:hover { background: var(--panel-2); }
.addmenu i { width: 10px; height: 10px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { .clip.queued, .clip.stopping { animation: none; } }

/* Clip editor + instrument */
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; position: relative; }
.ph-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 10px; border-bottom: 1px solid var(--line); }
.ph-head h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.ph-head h2 span { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 13px; }
.ph-head .sw { width: 10px; height: 22px; border-radius: 3px; }
.stage { min-height: 0; min-width: 0; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.fx { position: absolute; right: 10px; top: 46px; z-index: 25; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px var(--shade); padding: 12px; display: grid; gap: 12px; }
.cmenu { width: 220px; gap: 6px; }
.cmenu .btn { text-align: left; }
.knobs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 4px; }
.knob { display: grid; justify-items: center; gap: 3px; }
.knob .dial { width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(from 225deg, var(--tc) 0 calc(var(--v) * 270deg), var(--line) 0 270deg, transparent 0); display: grid; place-items: center; cursor: ns-resize; touch-action: none; }
.knob .dial::after { content: ""; width: 32px; height: 32px; border-radius: 50%; background: var(--panel); }
.knob .kl { font-size: 11px; color: var(--muted); }
.knob .kv { font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.drums { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; min-height: 0; flex: 1; }
.dgrid-wrap { min-height: 0; min-width: 0; overflow-y: auto; }
.grid { display: grid; grid-template-columns: 84px repeat(16, minmax(0, 1fr)); gap: 2px 3px; }
.grid .rh { font-size: 12px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.grid .rh.out { color: var(--muted); font-style: italic; }
.grid .rh code { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 4px; }
.colhead { border: 0; background: none; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; border-radius: 3px; padding: 1px 0; }
.colhead.b { color: var(--fg); font-weight: 600; }
.colhead.sel { background: var(--fg); color: var(--bg); }
.cell { min-height: 17px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); padding: 0; }
.cell.beat { border-left: 2px solid var(--muted); }
.cell.on { background: var(--tc); border-color: var(--tc); }
.cell.cont { background: color-mix(in srgb, var(--tc) 45%, transparent); border-color: transparent; }
.cell.phc { box-shadow: inset 0 0 0 2px var(--accent); }
.cell.selcol { outline: 2px dashed var(--fg); outline-offset: -2px; }
.cell.hit { filter: brightness(1.35); }
.kit { min-height: 0; display: grid; grid-template-rows: minmax(0, 3fr) minmax(0, 1.5fr); gap: 10px; }
.kit-main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr 1fr 1.3fr; gap: 8px; min-height: 0; }
.kit-aux { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, 1fr); gap: 6px; min-height: 0; padding: 6px; border-radius: 14px; background: var(--panel-2); }
.pad { border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: center; justify-items: center; gap: 1px; touch-action: none; min-height: 0; }
.pad strong { font-size: 14px; font-weight: 600; }
.pad code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pad.wide { grid-column: span 2; }
.pad.wide strong { font-size: 18px; }
.pad.aux { border-radius: 10px; background: var(--panel); }
.pad.aux strong { font-size: 12px; }
.pad.aux code { font-size: 10px; }
.pad.down { background: var(--tc); color: #fff; border-color: var(--tc); }
.pad.down code { color: #fff; }

.chords { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.chord { min-height: 54px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: center; text-align: center; touch-action: none; }
.chord strong { font-size: 16px; }
.chord span { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.chord.down { background: var(--tc); color: #fff; border-color: var(--tc); }
.chord.down span { color: #fff; }
.kbwrap { flex: 1; min-height: 96px; display: flex; gap: 8px; }
.octbtn { width: 48px; display: grid; gap: 6px; align-content: center; }
.octbtn button { min-height: 44px; padding: 0; }
.octbtn span { text-align: center; font-size: 11px; color: var(--muted); }
.kb { position: relative; flex: 1; touch-action: none; }
.wk, .bk { position: absolute; top: 0; border: 1px solid var(--line); border-radius: 0 0 10px 10px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 10px; font-size: 13px; }
.wk { background: var(--key-w); color: var(--key-w-ink); height: 100%; z-index: 1; }
.bk { background: var(--key-b); color: #ddd; height: 60%; z-index: 2; border-color: var(--key-b); }
.wk.off { background: var(--key-off); color: var(--muted); }
.bk.off { background: var(--key-off); border-color: var(--line); color: var(--muted); }
.wk.inscale::after, .bk.inscale::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 3px; height: 3px; border-radius: 2px; background: var(--tc); }
.wk.down, .bk.down { background: var(--tc); color: #fff; }
.wk .nl, .bk .nl { font-weight: 600; }
.strips { flex: 1; display: grid; gap: 6px; touch-action: none; }
.strip-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.stp { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; align-content: end; justify-items: center; padding-bottom: 8px; gap: 1px; }
.stp strong { font-size: 18px; }
.stp span { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.stp.sa { border-color: var(--tc); box-shadow: inset 0 -4px 0 var(--tc); }
.stp.down { background: var(--tc); color: #fff; }
.stp.down span { color: #fff; }
.miniroll { position: relative; height: 34px; border: 1px solid var(--line); border-radius: 8px; display: grid; padding: 4px 0; overflow: hidden; flex: none; }
.miniroll i { background: var(--tc); border-radius: 3px; margin-inline: 1px; color: #fff; font-size: 10.5px; font-weight: 600; font-style: normal; display: flex; align-items: center; padding-inline: 4px; overflow: hidden; white-space: nowrap; }
.miniroll i.hit { filter: brightness(1.3); box-shadow: 0 0 0 2px var(--accent); }
.miniroll .bl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .5; }
.miniroll .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); left: calc(var(--mpos, 0) * 100%); }
.roll { flex: 1; min-height: 80px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.roll .grid { grid-template-columns: 76px repeat(16, minmax(0, 1fr)); }
.roll .cell { min-height: 19px; }
.mel-edit .kbwrap { flex: 0 0 120px; min-height: 0; }
.mel-edit .chord { min-height: 40px; }
.emptyclip { display: grid; place-items: center; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

/* Code drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(500px, 50%); z-index: 30; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px var(--shade); }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0; }
.drawer pre { margin: 0; padding: 12px 14px; overflow: auto; background: var(--code-bg); font-family: var(--mono); font-size: 12px; line-height: 1.65; white-space: pre; user-select: text; -webkit-user-select: text; }
.drawer .com, .drawer .fence { color: var(--c-com); }
.drawer .fn { color: var(--c-fn); }
.drawer .str { color: var(--c-str); }
.drawer .num { color: var(--c-num); }
.drawer .kw { color: var(--c-kw); font-weight: 500; }
.drawer .id { color: var(--fg); font-weight: 500; }
.drawer .tok { color: var(--fg); border-radius: 3px; cursor: pointer; padding: 0 1px; }
.drawer .tok.hit { background: var(--accent); color: var(--accent-ink); }
.drawer .line.selt { background: color-mix(in srgb, var(--accent) 12%, transparent); display: inline-block; min-width: 100%; }
.drawer-f { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.45; }

/* Overlays */
.overlay { position: absolute; inset: 0; background: var(--shade); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(660px, 100%); max-height: 100%; overflow: auto; }
.dialog-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dialog-h h2 { font-family: var(--display); font-size: 16px; margin: 0; }
.dialog-b { padding: 14px 16px; display: grid; gap: 12px; }
.dialog-b dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
.dialog-b dt { font-weight: 600; }
.dialog-b dd { margin: 0; color: var(--muted); line-height: 1.45; }
.swaras { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.swc { display: grid; gap: 4px; }
.swc button { padding: 8px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); display: grid; gap: 1px; font-size: 12px; }
.swc button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swc button small { font-size: 10px; opacity: .75; }
.swc input { width: 100%; padding: 3px 2px; font-size: 11px; text-align: center; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
.field { display: grid; gap: 4px; }
.field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); user-select: text; -webkit-user-select: text; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 1100px) { :root { --head-w: 190px; } .brand { display: none; } .ph-head .note { display: none; } .ltitle h2 { display: none; } }

document.addEventListener('pointerup', () => drag = null);
document.addEventListener('pointercancel', () => drag = null);
document.addEventListener('keydown', e => {
  const d = e.target.closest && e.target.closest('[data-knob]');
  if (d && ['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); setKnob(d.dataset.knob, knobVal(d.dataset.knob) + (e.key === 'ArrowUp' || e.key === 'ArrowRight' ? .05 : -.05)); return; }
  if (!$('overlay').hidden) { if (e.key === 'Escape') $('overlay').hidden = true; return; }
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.key === ' ') { e.preventDefault(); return S.playing ? stop() : start(); }
  const k = e.key.toLowerCase();
  if (selTrack().kind === 'drums') { const pad = KIT.find(x => x.key === k); if (pad) { input('pad', pad.v); const el = document.querySelector(`[data-pad="${pad.v}"]`); if (el) flash(el); } return; }
  if (/^[1-8]$/.test(k)) { const i = +k - 1; if (i < chordSet().length) { input('chord', i); const el = document.querySelector(`[data-chord="${i}"]`); if (el) flash(el); } return; }
  const ki = KEYMAP.indexOf(k); if (ki < 0) return;
  const all = [...document.querySelectorAll('[data-key]')].sort((a, b) => +a.dataset.key - +b.dataset.key);
  const target = (S.layout === 'strips' || S.scaleLock ? all.filter(x => x.getAttribute('aria-disabled') !== 'true') : all)[ki];
  if (target) { input('key', +target.dataset.key); flash(target); }
});
renderAll();
</script>
